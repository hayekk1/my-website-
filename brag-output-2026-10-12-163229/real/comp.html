<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.plate{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 50%}
.ov{position:absolute;pointer-events:none}
.disp{font-family:"Inter Display",Inter,sans-serif}
.sub{left:60px;right:60px;top:1480px;text-align:center;color:#fff;font-size:62px;font-weight:600;letter-spacing:-.5px;text-shadow:0 2px 2px rgba(0,0,0,.8),0 0 24px rgba(0,0,0,.6)}
.cap{left:70px;right:70px;text-align:center;color:#fff;font-weight:900;letter-spacing:-3px;line-height:1.02;background:rgba(14,9,6,.82);border-radius:36px;padding:34px 30px}
#rew{left:0;right:0;top:820px;text-align:center;color:#fff;font-size:92px;font-weight:900;letter-spacing:-2px;text-shadow:5px 0 0 rgba(255,0,80,.7),-5px 0 0 rgba(0,200,255,.7)}
#scan{inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 3px,transparent 3px 8px)}
#vig{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.5) 100%)}
#tint{inset:0;background:#0b0705}
#shoulder{width:1500px;height:2400px;border-radius:50%;background:radial-gradient(ellipse at center,#2a2f36 0%,#1b1e22 55%,rgba(20,22,26,0) 72%);filter:blur(40px)}
#flash{inset:0;background:#fff}
#fade{inset:0;background:#000}
#fTitle{left:60px;right:60px;top:120px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5)}
#fTitle .a{font-size:140px;font-weight:900;letter-spacing:-6px;line-height:1}
#fTitle .b{font-size:42px;font-weight:600;color:#FFD9A8;margin-top:12px}
.tag{color:#fff;font-size:34px;font-weight:800;letter-spacing:2px;background:rgba(14,9,6,.72);padding:10px 20px;border-radius:14px;border:2px solid rgba(255,217,168,.8);white-space:nowrap}
#desc{left:60px;right:60px;top:1560px;text-align:center;color:#fff;font-size:54px;font-weight:600;line-height:1.2;text-shadow:0 2px 2px rgba(0,0,0,.8),0 0 24px rgba(0,0,0,.7)}
#desc b{color:#FFD9A8;font-weight:900;letter-spacing:1px}
#endT{left:0;right:0;top:170px;text-align:center;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.45)}
#endT .a{font-size:150px;font-weight:900;letter-spacing:-6px}
#endT .b{font-size:62px;font-weight:700;color:#FFE6C4;margin-top:6px}
canvas#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay}
</style></head><body>
<div id="stage">
 <div id="cam" style="position:absolute;inset:0">
  <img class="plate" id="pA"><img class="plate" id="pB">
 </div>
 <div id="tint" class="ov"></div>
 <div id="shoulder" class="ov"></div>
 <svg class="ov" id="lines" width="1080" height="1920" style="left:0;top:0"></svg>
 <div id="tags"></div>
 <div id="vig" class="ov"></div>
 <canvas id="grain" width="540" height="960"></canvas>
 <div id="scan" class="ov"></div>
 <div id="rew" class="ov disp">◀◀ 2 MINUTES<br>EARLIER</div>
 <div class="ov cap disp" id="cap1" style="top:1440px;font-size:96px">Yep.<br>That's my iced latte.</div>
 <div class="ov sub" id="s1">“One iced latte, please.”</div>
 <div class="ov sub" id="s2">“Coming right up.”</div>
 <div class="ov sub" id="s3">“Here you go.”</div>
 <div class="ov" id="fTitle"><div class="a disp">ICED LATTE.</div><div class="b">A quick description, while we have a second.</div></div>
 <div class="ov" id="desc"></div>
 <div class="ov cap disp" id="cap2" style="top:150px;font-size:104px">Not. A. Single.<br>Drop.</div>
 <div class="ov" id="endT"><div class="a disp">Iced latte.</div><div class="b">Worth protecting.</div></div>
 <div id="flash" class="ov"></div>
 <div id="fade" class="ov"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
const pad=n=>String(n).padStart(3,'0');
let PTS=window.ORBIT_PTS||[];
const ITEMS=[['espresso','ESPRESSO','A double shot, pulled hot, poured over the top.',[40,-150]],
             ['ice','ICE','Cracked, clinking, non-negotiable.',[50,30]],
             ['swirl','THE SWIRL','Espresso blooming slowly into the milk.',[-380,-40]],
             ['condensation','CONDENSATION','Beads of water. Proof it’s properly cold.',[-30,80]],
             ['milk','COLD MILK','Creamy, poured first. The base of everything.',[-360,90]]];
const IT=[11.0,12.2,13.4,14.6,15.8];
$('tags').innerHTML=ITEMS.map((it,i)=>`<div class="ov tag" id="tg${i}">${it[1]}</div>`).join('');
$('lines').innerHTML=ITEMS.map((it,i)=>`<g id="ln${i}"><line id="ll${i}" stroke="#FFD9A8" stroke-width="4" stroke-linecap="round"/><circle id="lc${i}" r="16" fill="none" stroke="#FFD9A8" stroke-width="4"/><circle id="ld${i}" r="6" fill="#FFD9A8"/></g>`).join('');

function show(el,on){el.style.display=on?'':'none';}
function fadeIn(el,t,a,b,{d=.35,dy=24,out=.25}={}){const on=t>=a&&t<b;show(el,on);if(!on)return;const k=eo(P(t,a,a+d))*(1-P(t,b-out,b));el.style.opacity=k;el.style.transform=`translateY(${(1-eo(P(t,a,a+d)))*dy}px)`;}
function plate(src,src2,mix,scale=1,tx=0,ty=0){
  if($('pA').getAttribute('src')!==src)$('pA').setAttribute('src',src);
  if(src2){ if($('pB').getAttribute('src')!==src2)$('pB').setAttribute('src',src2); $('pB').style.display=''; $('pB').style.opacity=mix; } else $('pB').style.display='none';
  $('cam').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
}
// deterministic grain
function grain(t){const c=$('grain'),g=c.getContext('2d');const im=g.createImageData(540,960);let s=Math.floor(t*30)*9301+49297;
  for(let i=0;i<im.data.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;const v=(s>>16)&255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}g.putImageData(im,0,0);}

function render(t){
  let blur=0,sat=1,shake=0,tint=0;
  if(t<2.6){plate('out/freeze.png',null,0,lerp(1.0,1.07,t/2.6));sat=.55;}
  else if(t<3.3){const k=eio(P(t,2.6,3.3));plate('out/freeze.png',null,0,lerp(1.07,1.0,k),Math.sin(t*90)*16,Math.cos(t*70)*6);sat=.3;}
  else if(t<5.9){plate('out/order.png',null,0,lerp(1.0,1.06,P(t,3.3,5.9)));}
  else if(t<8.4){const f=Math.min(59,Math.floor((t-5.9)*24));plate(`out/build_${pad(f)}.png`,null,0,1.0);}
  else if(t<9.7){plate('out/build_059.png',null,0,lerp(1.0,1.05,P(t,8.4,9.7)));}
  else if(t<10.3){const k=P(t,9.7,10.3);plate('out/build_059.png',null,0,lerp(1.05,1.25,eo(k)),lerp(0,-260,eo(k)),lerp(0,180,eo(k)));blur=Math.sin(Math.PI*k)*18;shake=Math.exp(-(t-9.75)*7)*40*(t>9.75?1:0);}
  else if(t<17.0){const x=cl((t-10.3)/6.0)*59,f=Math.floor(x),fr=x-f;plate(`out/orbit_${pad(f)}.png`,f<59?`out/orbit_${pad(f+1)}.png`:null,fr,1.0);sat=lerp(1,.75,P(t,10.3,10.8));tint=lerp(0,.25,P(t,10.3,10.8))*(1-P(t,16.7,17.0));}
  else if(t<18.0){const f=Math.min(23,Math.floor((t-17.0)*24));plate(`out/land_${pad(f)}.png`,null,0,1.0);if(t>17.92)shake=Math.exp(-(t-17.92)*12)*14;}
  else if(t<19.6){plate('out/land_023.png',null,0,lerp(1.0,1.04,P(t,18,19.6)));}
  else {plate('out/hero.png',null,0,lerp(1.0,1.06,P(t,19.6,22.2)));}
  $('cam').style.filter=`saturate(${sat}) blur(${blur}px)`+(t>=2.6&&t<3.3?' contrast(1.3) hue-rotate(-10deg)':'');
  $('stage').style.transform=`translate(${Math.sin(t*97)*shake}px,${Math.cos(t*83)*shake}px)`;
  $('tint').style.opacity=tint;
  // shoulder swipe
  const sk=P(t,9.72,10.2);show($('shoulder'),t>=9.72&&t<10.2);$('shoulder').style.transform=`translate(${lerp(-1700,1300,sk)}px,${lerp(-300,-150,sk)}px)`;
  let fl=0;if(t<.2)fl=1-t*5;if(t>=9.8)fl=Math.max(fl,.55*Math.exp(-(t-9.8)*10));if(t>=10.3)fl=Math.max(fl,.6*Math.exp(-(t-10.3)*9));$('flash').style.opacity=fl;
  // overlays
  fadeIn($('cap1'),t,.3,2.6,{out:.05});
  show($('scan'),t>=2.6&&t<3.3);show($('rew'),t>=2.6&&t<3.3);
  fadeIn($('s1'),t,3.6,4.85,{dy:0,d:.15});fadeIn($('s2'),t,4.95,5.9,{dy:0,d:.15});fadeIn($('s3'),t,8.65,9.7,{dy:0,d:.15,out:.05});
  fadeIn($('fTitle'),t,10.5,17.0);
  // tracked callouts
  const x=cl((t-10.3)/6.0)*59,f=Math.floor(x),fr=x-f;
  ITEMS.forEach((it,i)=>{const on=t>=IT[i]&&t<17.0;show($('tg'+i),on);$('ln'+i).style.display=on?'':'none';if(!on||!PTS.length)return;
    const a=PTS[Math.min(59,f)][it[0]],b=PTS[Math.min(59,f+1)][it[0]];const px=lerp(a[0],b[0],fr)*1080,py=lerp(a[1],b[1],fr)*1920;
    const k=eo(P(t,IT[i],IT[i]+.35)),fade=1-P(t,16.75,17.0);const lx=px+it[3][0],ly=py+it[3][1];
    const tg=$('tg'+i);tg.style.left=lx+'px';tg.style.top=ly+'px';tg.style.opacity=k*fade;tg.style.transform=`scale(${lerp(.7,1,k)})`;
    const tw=tg.offsetWidth,th=tg.offsetHeight;const ex=it[3][0]<0?lx+tw:lx,ey=ly+th/2;
    $('ll'+i).setAttribute('x1',px);$('ll'+i).setAttribute('y1',py);$('ll'+i).setAttribute('x2',lerp(px,ex,k));$('ll'+i).setAttribute('y2',lerp(py,ey,k));
    ['lc','ld'].forEach(p=>{$(p+i).setAttribute('cx',px);$(p+i).setAttribute('cy',py);});$('ln'+i).style.opacity=fade;});
  let cur=-1;IT.forEach((a,i)=>{if(t>=a)cur=i;});
  if(cur>=0&&t<17.0){const it=ITEMS[cur];$('desc').innerHTML=`<b>${it[1]}</b><br>${it[2]}`;const k=eo(P(t,IT[cur],IT[cur]+.25));show($('desc'),true);$('desc').style.opacity=k*(1-P(t,16.75,17));}else show($('desc'),false);
  fadeIn($('cap2'),t,18.1,19.6,{out:.1});
  fadeIn($('endT'),t,19.8,99,{d:.5});$('endT').querySelector('.b').style.opacity=P(t,20.4,20.8);
  $('fade').style.opacity=P(t,21.8,22.2);
  grain(t);
}
window.render=render;
</script></body></html>
